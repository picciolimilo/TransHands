# Baseline Re:InterHand Configuration (ST-GCN)
# Stage 2-A: TransHands Training on Re:InterHand with Unfrozen Encoder

dataset:
  name: reinterhand
  root: dataset/ReInterHand
  use_2d: true
  seq_len: 64          
  stride: 10
  min_valid_frames: 40  
  augmentation: true
  subset_train: null    
  subset_val: null

model:
  encoder_type: stgcn
  num_hand_joints: 21
  num_body_joints: 18
  freeze_encoder: false
  weights_path: external/st-gcn/checkpoint/pretrain/st_gcn.kinetics.pt

training:
  batch_size: 8
  epochs: 80
  warmup_epochs:  10

  lr_backbone: 0.000005      # 5e-6 
  lr: 0.00005                # 5e-5 

  weight_decay: 0.01
  device: cuda
  mmm_weight:  0.0

paths:
  checkpoint: experiments/lifting/STGCN/stgcn_stage2a/checkpoint
  plot: experiments/lifting/STGCN/stgcn_stage2a/plot