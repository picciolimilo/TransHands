# Baseline Re:InterHand Configuration (PoseFormerV2)
# Stage 2-A: TransHands Training on Re:InterHand with Unfrozen Encoder

dataset:
  name: reinterhand
  root: dataset/ReInterHand
  use_2d: true
  seq_len: 243          
  stride: 10
  min_valid_frames: 40  
  augmentation: true

model:
  encoder_type: poseformerv2
  num_hand_joints: 21
  num_body_joints: 17
  freeze_encoder: false
  weights_path: external/PoseFormerV2/checkpoint/pretrain/27_243_45.2.bin

training:
  batch_size: 8
  epochs: 80
  warmup_epochs:  10

  lr_backbone: 0.000005      # 5e-6 
  lr: 0.00005                # 5e-5 

  weight_decay: 0.01
  device: cuda
  mmm_weight:  0.0

paths:
  checkpoint: experiments/lifting/PoseFormerV2/poseformerv2_stage2a/checkpoint
  plot: experiments/lifting/PoseFormerV2/poseformerv2_stage2a/plot